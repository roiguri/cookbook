name: Factory iOS Simulator Validation (Gated, 0 EAS Builds)

# Triggered ONLY via manual workflow_dispatch (on `native-mobile`, sharing actions/cache!)
# or explicit opt-in tag push (`factory-ios-smoke-*`, `factory-ios-holdout-*`)
# after local WSL2 Android convergence passes — never on normal pushes/PRs —
# to conserve private-repo macOS runner minutes while keeping `main` untouched.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Validation suite to run: smoke (visible) or holdout (private repo)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - holdout
      slice:
        description: 'Optional slice filter (e.g. 00) for holdout runs'
        required: false
        default: ''
        type: string
      force_native_rebuild:
        description: 'Force full Expo prebuild + CocoaPods + xcodebuild even if native cache matches'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'factory-ios-smoke-*'
      - 'factory-ios-holdout-*'

concurrency:
  group: factory-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-sim:
    runs-on: macos-15
    timeout-minutes: 45
    # Hard safety guard: never run autonomous factory validation on main
    if: github.ref != 'refs/heads/main'
    outputs:
      suite: ${{ steps.cfg.outputs.suite }}
      slice: ${{ steps.cfg.outputs.slice }}
      shards: ${{ steps.cfg.outputs.shards }}
      fp_hash: ${{ steps.fp.outputs.hash }}

    steps:
      - name: Resolve suite, slice filter & shard matrix
        id: cfg
        run: |
          SLICE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SUITE="${{ inputs.suite }}"
            SLICE="${{ inputs.slice }}"
            FORCE_REBUILD="${{ inputs.force_native_rebuild }}"
          elif [[ "${{ github.ref }}" == refs/tags/factory-ios-holdout-* ]]; then
            SUITE="holdout"
            FORCE_REBUILD="false"
            if [[ "${{ github.ref }}" =~ factory-ios-holdout-slice([0-9]{2})- ]]; then
              SLICE="${BASH_REMATCH[1]}"
            fi
          else
            SUITE="smoke"
            FORCE_REBUILD="false"
          fi

          if [ "$SUITE" = "holdout" ] && [ -z "$SLICE" ]; then
            SHARDS='[{"id":"s1","suites":"A,B,C"},{"id":"s2","suites":"D,E,F"},{"id":"s3","suites":"G,H,I"},{"id":"s4","suites":"J,K,L"}]'
          else
            SHARDS='[{"id":"single","suites":""}]'
          fi

          echo "suite=${SUITE}" >> "$GITHUB_OUTPUT"
          echo "slice=${SLICE}" >> "$GITHUB_OUTPUT"
          echo "force_native_rebuild=${FORCE_REBUILD}" >> "$GITHUB_OUTPUT"
          echo "shards=${SHARDS}" >> "$GITHUB_OUTPUT"
          echo "Resolved suite=${SUITE}, slice=${SLICE:-all}, force_native_rebuild=${FORCE_REBUILD} (ref=${{ github.ref }})"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Compute iOS native fingerprint
        id: fp
        run: |
          HASH=$(cat apps/mobile/package.json apps/mobile/package-lock.json apps/mobile/app.config.ts | shasum -a 256 | cut -c1-16)
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Native iOS fingerprint: ${HASH}"

      - name: Restore cached compiled iOS Simulator .app (reused across JS-only fixes)
        id: app-cache
        if: ${{ steps.cfg.outputs.force_native_rebuild != 'true' }}
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios-sim-cache
          key: ios-sim-app-macos15-${{ steps.fp.outputs.hash }}

      - name: Generate native iOS project via Expo CNG (before restoring Pods/DerivedData cache)
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_USE_DTU: 'true'
          EXPO_ENABLE_APPLE_PAID_ENTITLEMENTS: 'false'
          EXPO_NO_TELEMETRY: '1'
        run: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install --clean

      - name: Restore CocoaPods & Xcode DerivedData caches
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
            apps/mobile/ios/build/DerivedData
          key: ios-pods-derived-macos15-${{ steps.fp.outputs.hash }}
          restore-keys: |
            ios-pods-derived-macos15-

      - name: Build iOS Simulator .app via CocoaPods + xcodebuild (0 EAS quota)
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_USE_DTU: 'true'
          EXPO_ENABLE_APPLE_PAID_ENTITLEMENTS: 'false'
          EXPO_NO_TELEMETRY: '1'
        run: |
          cd apps/mobile/ios
          pod install
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building iOS Simulator workspace=${WORKSPACE} scheme=${SCHEME}"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p ../ios-sim-cache
          rm -rf ../ios-sim-cache/CookbookE2E.app
          cp -R "$APP_PATH" ../ios-sim-cache/CookbookE2E.app

      - name: Refresh embedded JS bundle inside cached .app (JS-only fast path)
        if: ${{ steps.app-cache.outputs.cache-hit == 'true' }}
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_USE_DTU: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: |
          echo "Native fingerprint unchanged — reusing compiled .app and refreshing JS bundle only."
          cd apps/mobile
          npx expo export:embed \
            --platform ios \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output ios-sim-cache/CookbookE2E.app/main.jsbundle \
            --assets-dest ios-sim-cache/CookbookE2E.app \
            --dev false

      - name: Package CookbookE2E.app tarball (preserves Mach-O executable bits & symlinks)
        run: |
          tar -cf CookbookE2E.app.tar -C apps/mobile/ios-sim-cache CookbookE2E.app
          ls -lh CookbookE2E.app.tar

      - name: Upload compiled CookbookE2E.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app-${{ github.run_number }}
          path: CookbookE2E.app.tar
          retention-days: 14

  validate-ios-sim:
    needs: build-ios-sim
    runs-on: macos-15
    timeout-minutes: 45
    if: github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.build-ios-sim.outputs.shards) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (for Firebase Local Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root & functions dependencies for hermetic DTU
        run: |
          npm ci
          npm --prefix functions ci

      - name: Download compiled CookbookE2E.app artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-sim-app-${{ github.run_number }}
          path: .

      - name: Extract CookbookE2E.app
        run: |
          mkdir -p apps/mobile/ios-sim-cache
          tar -xf CookbookE2E.app.tar -C apps/mobile/ios-sim-cache
          ls -ld apps/mobile/ios-sim-cache/CookbookE2E.app

      - name: Install Firebase CLI & Maestro CLI
        run: |
          npm install -g firebase-tools
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Checkout isolated holdout repository (holdout suite only)
        if: ${{ needs.build-ios-sim.outputs.suite == 'holdout' }}
        uses: actions/checkout@v4
        with:
          repository: roiguri/cookbook-factory-holdout
          ssh-key: ${{ secrets.HOLDOUT_REPO_DEPLOY_KEY }}
          path: .factory-holdout

      - name: Boot iOS Simulator, install .app & verify SpringBoard URL-scheme approval
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e "
            const d = JSON.parse(require('fs').readFileSync(0,'utf8')).devices;
            const match = Object.entries(d)
              .filter(([k, list]) => k.includes('iOS') && Array.isArray(list) && list.some((x) => x.name.includes('iPhone') && x.isAvailable))
              .sort(([a], [b]) => a.localeCompare(b))
              .pop();
            if (!match) { console.error('No available iOS iPhone simulator found'); process.exit(1); }
            const phone = match[1].find((x) => x.name.includes('iPhone') && x.isAvailable);
            console.error('Selected simulator:', match[0], phone.name, phone.udid);
            console.log(phone.udid);
          ")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" apps/mobile/ios-sim-cache/CookbookE2E.app

          # Launch the app FIRST so Maestro XCTest attaches to the active window, then open
          # the custom scheme URL and explicitly tap SpringBoard's one-time "Open" confirmation
          # (both before and after clearState), failing fast if any SpringBoard alert remains.
          xcrun simctl launch "$UDID" com.roiguri.cookbook.e2e || true
          sleep 4
          xcrun simctl openurl "$UDID" "cookbook-e2e://home" || true
          sleep 3
          cat << 'EOF' > /tmp/ios-scheme-warmup.yml
          appId: com.roiguri.cookbook.e2e
          ---
          - tapOn:
              text: 'Open'
              optional: true
          - waitForAnimationToEnd
          - tapOn:
              text: 'Open'
              optional: true
          - waitForAnimationToEnd
          - assertNotVisible:
              text: 'Open in.*'
          - launchApp:
              clearState: true
          - openLink: 'cookbook-e2e://home'
          - tapOn:
              text: 'Open'
              optional: true
          - waitForAnimationToEnd
          - assertNotVisible:
              text: 'Open in.*'
          EOF
          maestro --device "$UDID" test /tmp/ios-scheme-warmup.yml
          rm -f /tmp/ios-scheme-warmup.yml
          xcrun simctl terminate "$UDID" com.roiguri.cookbook.e2e || true

      - name: Start hermetic Cookbook DTU & execute iOS Simulator shard (${{ matrix.shard.id }})
        env:
          NO_UPDATE_NOTIFIER: '1'
        run: |
          mkdir -p factory-ios-artifacts
          if [ "${{ needs.build-ios-sim.outputs.suite }}" = "holdout" ]; then
            FILTER_ARGS=""
            if [ -n "${{ needs.build-ios-sim.outputs.slice }}" ]; then
              FILTER_ARGS="${FILTER_ARGS} --slice=${{ needs.build-ios-sim.outputs.slice }}"
            fi
            if [ -n "${{ matrix.shard.suites }}" ]; then
              FILTER_ARGS="${FILTER_ARGS} --suite=${{ matrix.shard.suites }}"
            fi
            node factory/dtu/start-dtu.mjs --seed=baseline \
              --exec="node factory/validator/run-validation.mjs --holdout-dir=.factory-holdout --platform=ios --device=\"${SIM_UDID}\" --out-dir=factory-ios-artifacts --deterministic-only --save-trajectories ${FILTER_ARGS}"
          else
            node factory/dtu/start-dtu.mjs --seed=baseline \
              --exec="maestro --device \"${SIM_UDID}\" test --debug-output factory-ios-artifacts --flatten-debug-output apps/mobile/.maestro/smoke/boot-dtu.yml"
          fi

      - name: Purge isolated holdout checkout immediately after execution
        if: always()
        run: rm -rf .factory-holdout

      - name: Upload iOS shard validation artifacts (${{ matrix.shard.id }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-validation-${{ needs.build-ios-sim.outputs.suite }}-${{ matrix.shard.id }}-${{ github.run_number }}
          path: factory-ios-artifacts/
          retention-days: 14
