<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>

    <!-- Link preview defaults. The link-preview edge function replaces this block per page
         (a recipe's name, description and photo); keep the markers. -->
    <!-- link-preview:start -->
    <meta name="description" content="ספר המתכונים של המשפחה" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_APP_TITLE%" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="ספר המתכונים של המשפחה" />
    <meta property="og:image" content="/img/og/link-preview-v1.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- link-preview:end -->

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts: preloaded early (HTML parse time) but non-blocking via onload swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+Hebrew:wght@300;400;500;600;700&family=Noto+Serif+Hebrew:wght@400;600&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+Hebrew:wght@300;400;500;600;700&family=Noto+Serif+Hebrew:wght@400;600&display=swap"
    /></noscript>

    <!-- PWA theme color -->
    <meta name="theme-color" content="%VITE_THEME_COLOR%" />

    <!-- Favicon for browsers -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="img/icon/%VITE_ICON_PATH%/wooden-spoon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="img/icon/%VITE_ICON_PATH%/wooden-spoon-16.png"
    />

    <!-- Icon for Android Chrome -->
    <link rel="manifest" href="/%VITE_MANIFEST_FILE%" />

    <!-- Icon for iOS -->
    <link
      rel="apple-touch-icon"
      sizes="128x128"
      href="img/icon/%VITE_ICON_PATH%/wooden-spoon-128.png"
    />

    <!-- SPA Entry Point -->
    <script type="module" src="/src/app.js" defer></script>
  </head>
  <body class="spa-app">
    <!-- Application Header -->
    <header class="header-container app-loading">
      <div class="menu-title-container">
        <button class="nav-toggle" aria-label="Toggle navigation">
          <span class="hamburger"></span>
        </button>
        <a href="/home">
          <div class="logo">Our Kitchen <em>Chronicles</em></div>
        </a>
      </div>
      <div class="nav-search-container">
        <nav dir="rtl">
          <ul>
            <li><a href="/home">דף הבית</a></li>
            <li><a href="/categories">מתכונים</a></li>
            <li><a href="/propose-recipe">הצעת מתכון</a></li>
          </ul>
        </nav>
        <div class="search-auth-container">
          <div class="search-bar header-search">
            <header-search-bar></header-search-bar>
          </div>
          <auth-avatar></auth-avatar>
        </div>
      </div>
    </header>

    <!-- SPA Content Container -->
    <main id="spa-content" class="spa-content">
      <div class="page-loading">
        <div class="page-loading-spinner"></div>
      </div>
    </main>

    <!-- Application Footer -->
    <footer>
      <p>&copy; 2024 Our Kitchen Chronicles. All rights reserved.</p>
      <a id="icon-attribute" href="https://www.flaticon.com/free-icons/spoon" title="spoon icons"
        >Spoon icons created by Freepik - Flaticon</a
      >
    </footer>

    <!-- Auth Components -->
    <auth-controller>
      <auth-content>
        <login-form slot="login-form" class="active"></login-form>
        <signup-form slot="signup-form"></signup-form>
        <forgot-password slot="forgot-password"></forgot-password>
        <user-profile slot="user-profile"></user-profile>
      </auth-content>
    </auth-controller>
  </body>
</html>
