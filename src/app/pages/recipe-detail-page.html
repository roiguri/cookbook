<div class="recipe-detail">
  <main class="recipe-container" role="main">
    <!-- The page's corner actions: ⋮ in the corner, share beside it -->
    <div class="recipe-actions">
      <!-- Menu for recipe actions -->
      <!-- Every action needs a signed-in user; the menu is shown in setupMenuHandlers. -->
      <div class="recipe-menu" style="display: none">
        <button
          class="recipe-menu-button"
          type="button"
          aria-label="תפריט"
          title="תפריט"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="2" />
            <circle cx="12" cy="12" r="2" />
            <circle cx="12" cy="19" r="2" />
          </svg>
        </button>
        <div class="recipe-menu-dropdown" role="menu" aria-label="פעולות על המתכון">
          <!-- Owner of a private recipe: its status, then the owner actions -->
          <div class="own-menu__status" id="own-status" hidden>
            <div class="row">
              <status-badge id="own-status-badge"></status-badge>
              <span class="when" id="own-status-when"></span>
            </div>
            <p id="own-status-text" hidden></p>
            <p class="own-menu__note" id="own-status-note" hidden></p>
          </div>
          <button class="menu-item menu-item--primary" id="mark-tested-btn" type="button" hidden>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span>סימון כנבדק</span>
          </button>
          <button class="menu-item" id="mark-to-try-btn" type="button" hidden>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            <span>החזרה ל״לנסות״</span>
          </button>
          <button class="menu-item" id="submit-recipe-btn" type="button" hidden>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" />
            </svg>
            <span>שליחה לפרסום</span>
          </button>
          <button class="menu-item" id="resubmit-recipe-btn" type="button" hidden>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5" />
            </svg>
            <span>עריכה ושליחה מחדש</span>
          </button>
          <button class="menu-item" id="edit-recipe-btn" type="button" hidden>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
            </svg>
            <span>עריכה</span>
          </button>
          <button class="menu-item" id="cancel-submission-btn" type="button" hidden>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
            <span>ביטול השליחה</span>
          </button>
          <button class="menu-item" id="suggest-edit-btn" style="display: none">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
            </svg>
            <span>הצע עריכה</span>
          </button>
          <button class="menu-item" id="add-to-meal-btn" style="display: none">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span>הוסף לארוחה שלי</span>
          </button>
          <button class="menu-item menu-item--danger" id="delete-recipe-btn" type="button" hidden>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
            </svg>
            <span>מחיקת המתכון</span>
          </button>
        </div>
      </div>

      <!-- Share: open to everyone once the recipe shows (setupShareHandlers). A published
         recipe offers link or text; the author's private recipe offers family or text;
         anyone else's private recipe goes straight to text. -->
      <div class="recipe-share" hidden>
        <button
          class="recipe-menu-button"
          id="share-recipe-btn"
          type="button"
          aria-label="שיתוף המתכון"
          title="שיתוף"
          aria-haspopup="menu"
          aria-expanded="false"
        ></button>
        <div class="recipe-menu-dropdown share-menu" role="menu" aria-label="שיתוף המתכון">
          <button class="menu-item" id="share-family-btn" type="button" role="menuitem" hidden>
            <span class="menu-item__icon" id="share-family-icon"></span>
            <span>שיתוף עם בני משפחה</span>
          </button>
          <button class="menu-item" id="share-link-btn" type="button" role="menuitem">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
            <span>שליחת קישור</span>
          </button>
          <button class="menu-item" id="share-text-btn" type="button" role="menuitem">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 6H3M21 12H9M21 18H7" />
            </svg>
            <span>שליחת המתכון כטקסט</span>
          </button>
        </div>
      </div>
    </div>

    <!-- recipe component will be dynamically inserted here -->
  </main>

  <!-- Suggest edit modal -->
  <suggest-edit-modal></suggest-edit-modal>

  <!-- Success message modal -->
  <message-modal></message-modal>
</div>
