<div class="recipe-detail">
  <main class="recipe-container" role="main">
    <!-- Menu for recipe actions -->
    <!-- Every action needs a signed-in user; the menu is shown in setupMenuHandlers. -->
    <div class="recipe-menu" style="display: none">
      <button class="recipe-menu-button" aria-label="תפריט" title="תפריט">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="2" />
          <circle cx="12" cy="12" r="2" />
          <circle cx="12" cy="19" r="2" />
        </svg>
      </button>
      <div class="recipe-menu-dropdown" role="menu" aria-label="פעולות על המתכון">
        <!-- Owner of a private recipe: its status, then the owner actions -->
        <div class="own-menu__status" id="own-status" hidden>
          <div class="row">
            <status-badge id="own-status-badge"></status-badge>
            <span class="when" id="own-status-when"></span>
          </div>
        </div>
        <button class="menu-item menu-item--primary" id="mark-tested-btn" type="button" hidden>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          <span>סימון כנבדק</span>
        </button>
        <button class="menu-item" id="edit-recipe-btn" type="button" hidden>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
          </svg>
          <span>עריכה</span>
        </button>
        <button class="menu-item" id="suggest-edit-btn" style="display: none">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z" />
          </svg>
          <span>הצע עריכה</span>
        </button>
        <button class="menu-item" id="add-to-meal-btn" style="display: none">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span>הוסף לארוחה שלי</span>
        </button>
        <button class="menu-item menu-item--danger" id="delete-recipe-btn" type="button" hidden>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
          </svg>
          <span>מחיקת המתכון</span>
        </button>
      </div>
    </div>

    <!-- recipe component will be dynamically inserted here -->
    <!-- TODO - add print/share button -->
  </main>

  <!-- Suggest edit modal -->
  <suggest-edit-modal></suggest-edit-modal>

  <!-- Success message modal -->
  <message-modal></message-modal>
</div>
